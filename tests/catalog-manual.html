<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/style.css"><title>Prueba local de editores</title><main><h1>Prueba local</h1><p>Sin conexión a Supabase. No guarda datos reales.</p><button id="product">Editar producto de prueba</button><button id="promos">Editar promociones de prueba</button><button id="appearance">Editar apariencia de prueba</button><pre id="result"></pre><iframe title="Vista móvil" src="../preview-postres.html" width="390" height="844" style="max-width:100%;border:1px solid #ddd"></iframe></main><dialog id="editor"><button id="close">Cerrar</button><h2 id="editorTitle"></h2><form id="editForm"></form><p id="error" role="status"></p></dialog><script type="module">
import {appearanceEditor} from '../assets/appearance-editor.js?v=interactive-9';
import {catalogFields,wireCatalogFields,promotionsEditor} from '../assets/catalog-editor.js';
const $=s=>document.querySelector(s);let promotions=[];
function openEditor(title,html,save){$('#editorTitle').textContent=title;$('#editForm').innerHTML=html+'<button>Guardar</button>';$('#error').textContent='';$('#editForm').onsubmit=async e=>{e.preventDefault();try{await save(new FormData(e.target));$('#editor').close();}catch(err){$('#error').textContent=err.message;}};if(!$('#editor').open)$('#editor').showModal();}
$('#appearance').onclick=()=>appearanceEditor({nombre:'Demo',plantilla:'berries'},openEditor,async p=>{$('#result').textContent=JSON.stringify(p,null,2);});
$('#close').onclick=()=>$('#editor').close();
$('#product').onclick=()=>{let save;openEditor('Producto de prueba',catalogFields(),async()=>{$('#result').textContent=JSON.stringify(await save(null,'demo'),null,2);});save=wireCatalogFields($('#editForm'));};
$('#promos').onclick=()=>promotionsEditor({promociones:promotions},openEditor,async p=>{promotions=p.promociones;$('#result').textContent=JSON.stringify(p,null,2);});
</script></html>
