<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificación de dibujos del juego</title><link rel="stylesheet" href="../assets/style.css?v=gamefix-14"></head><body><main><h1 style="font-size:28px">Dibujos del minijuego</h1><p>Prueba visual: cada figura se dibuja sin imágenes externas ni emojis.</p><div id="figures" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:20px"></div></main><script type="module">import {gameArt} from '../assets/game-art.js?v=gamefix-14';const names={berry:'Fresa',mascot:'Mascota',cake:'Pastel',chocolate:'Chocolate',gold:'Estrella',pepper:'Picante',basket:'Cesta',burger:'Hamburguesa',coffee:'Café',trophy:'Trofeo'};document.querySelector('#figures').innerHTML=Object.entries(names).map(([k,n])=>'<article style="background:#fff0e9;padding:15px;border-radius:15px">'+gameArt(k)+'<p>'+n+'</p></article>').join('');</script></body></html>
