<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/style.css"><title>Prueba local de crecimiento</title><body><main><h1>Prueba local · no guarda en Supabase</h1><nav><button data-section="crecimiento">Ventas y crecimiento</button><button data-section="resultados">Resultados</button><button data-section="fidelidad">Fidelidad</button></nav><p id="status" role="status"></p><div id="host"></div><pre id="saved"></pre></main><dialog id="editor"><h2 id="title"></h2><form id="editForm"></form><button id="close" type="button">Cerrar</button></dialog><script type="module">
import {renderGrowth} from '../assets/growth-admin.js';
const r={id:'test',nombre:'Negocio de prueba',slug:'prueba',crecimiento:{}};
const db={from(table){let payload;const q={select(){return q},eq(){return q},order(){return q},update(p){payload=p;return q},insert(p){payload=p;return q},then(resolve){if(payload){document.querySelector('#saved').textContent=JSON.stringify(payload,null,2);if(payload.crecimiento)r.crecimiento=payload.crecimiento;}resolve({data:table==='productos'?[{id:'p1',nombre:'Producto de prueba'}]:[{id:'test'}],error:null})}};return q},async rpc(name){return {data:name==='resultados_menu'?{eventos:{visita:10,consulta:3},ventas:{cantidad:2,importe:50,promedio:25},productos:[],canales:[]}:name==='sellos_menu'?0:'OK',error:null}}};
let section='crecimiento';const status=t=>document.querySelector('#status').textContent=t;
function openEditor(title,html,save){document.querySelector('#title').textContent=title;const form=document.querySelector('#editForm');form.innerHTML=html+'<button>Guardar</button>';form.onsubmit=async e=>{e.preventDefault();try{await save(new FormData(form));document.querySelector('#editor').close()}catch(e){status(e.message)}};document.querySelector('#editor').showModal();}
async function draw(){await renderGrowth(section,{db,r,host:document.querySelector('#host'),openEditor,reload:draw,status,showQr:async(_,src)=>status('QR: '+src)});}
document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;draw()});document.querySelector('#close').onclick=()=>document.querySelector('#editor').close();draw();
</script></body></html>
